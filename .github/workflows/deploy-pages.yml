name: Build and publish YZ MDM WebADB

on:
  push:
    branches: [main, master]
    paths:
      - 'web-installer/**'
      - 'yz-mdm/**'
      - '.github/workflows/deploy-pages.yml'
      - 'README.md'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      YZMDM_KEYSTORE_BASE64: ${{ secrets.YZMDM_SIGNING_KEYSTORE_BASE64 }}
      YZMDM_STORE_PASSWORD: ${{ secrets.YZMDM_STORE_PASSWORD }}
      YZMDM_KEY_ALIAS: ${{ secrets.YZMDM_KEY_ALIAS }}
      YZMDM_KEY_PASSWORD: ${{ secrets.YZMDM_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Prepare signed APK when release credentials are configured
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for value in "$YZMDM_KEYSTORE_BASE64" "$YZMDM_STORE_PASSWORD" "$YZMDM_KEY_ALIAS" "$YZMDM_KEY_PASSWORD"; do
            if [[ -n "$value" ]]; then count=$((count + 1)); fi
          done
          if [[ "$count" -eq 4 ]]; then
            printf '%s' "$YZMDM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yz-mdm-release.jks"
            echo "release_ready=true" >> "$GITHUB_OUTPUT"
          elif [[ "$count" -eq 0 ]]; then
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No release signing secrets are configured. The live WebADB will publish without a downloadable production APK."
          else
            echo "::error::Configure all four YZMDM signing secrets together."
            exit 1
          fi
      - name: Build signed Android release
        if: steps.signing.outputs.release_ready == 'true'
        working-directory: yz-mdm
        env:
          YZMDM_SIGNING_STORE_FILE: ${{ runner.temp }}/yz-mdm-release.jks
        run: gradle :app:assembleRelease --no-daemon
      - name: Build WebADB
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-installer/package-lock.json
      - name: Compile website
        working-directory: web-installer
        run: |
          npm ci
          npm run build
      - name: Prepare Pages files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web-installer/dist/downloads
          if [[ "${{ steps.signing.outputs.release_ready }}" == "true" ]]; then
            cp yz-mdm/app/build/outputs/apk/release/app-release.apk web-installer/dist/downloads/yz-mdm.apk
            ready=true
          else
            ready=false
          fi
          version_name="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\\([^"]*\\)".*/\\1/p' yz-mdm/app/build.gradle.kts | head -n1)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\\([0-9][0-9]*\\).*/\\1/p' yz-mdm/app/build.gradle.kts | head -n1)"
          if [[ -z "$version_name" || -z "$version_code" ]]; then
            echo "::error::Could not read the Android version from Gradle."
            exit 1
          fi
          cat > web-installer/dist/build-info.json <<JSON
          {
            "applicationId": "com.yz.mdm",
            "versionName": "$version_name",
            "versionCode": $version_code,
            "releaseReady": $ready
          }
          JSON
          touch web-installer/dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-installer/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
