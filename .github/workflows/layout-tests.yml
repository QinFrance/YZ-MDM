name: Launcher layout tests
on:
  push:
    paths: ['yz-mdm/app/src/main/assets/index.html', 'tests/launcher-layout.test.mjs', '.github/workflows/layout-tests.yml']
  pull_request:
    paths: ['yz-mdm/app/src/main/assets/index.html', 'tests/launcher-layout.test.mjs', '.github/workflows/layout-tests.yml']
jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/launcher-layout.test.mjs
