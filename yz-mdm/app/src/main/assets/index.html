      const row=(icon,title,sub,id)=>'<button class="sheet-button'+(id==='system'?' system-link':'')+'" data-choice="'+id+'">'+svg(icon)+'<span>'+title+'</span><em>'+sub+'</em>'+svg('chevron')+'</button>';
      const pages={
        launcher:()=>{return show('Réglages du launcher','<p class="sheet-copy">Personnalisez l’écran d’accueil YiDream.</p>'+pref('rotate','Mode voiture automatique','S’active quand l’écran passe en paysage',true,carModeAutomatic)+pref('map','Afficher Waze','Ajouter le raccourci voiture à l’accueil',true,wazeEnabled)+pref('clock','Horloge et date hébraïque','Afficher l’heure et les dates grégorienne et hébraïque sur l’accueil.',true,clockWidgetEnabled)+row('language','Langue de l’application',languageName(),'language')+row('sun','Apparence',appearanceName(),'appearance')+row('phone','Disposition de l’accueil',layoutMode==='compact'?'Compacte':'Actuelle','layout')+row('refresh','Installer la dernière mise à jour','','update')+row('phone','Choisir YiDream comme écran d’accueil','Demander à Android de définir YiDream','home-role')+row('phone','Retirer le mode appareil dédié','Entrer le code administrateur pour lever les restrictions','release-owner')+row('phone','Paramètres Android','Accès aux réglages du téléphone','system'))},
        language:()=>showNested('Langue de l’application','<p class="sheet-copy">Choisissez la langue de YiDream.</p><div class="lang-options language-menu" role="group" aria-label="Langue de l’application">'+languageOptions()+'</div>'),
        layout:()=>showNested('Disposition de l’accueil','<div class="lang-options" role="group" aria-label="Disposition de l’accueil">'+[['standard','Actuelle'],['compact','Compacte']].map(([mode,label])=>'<button class="lang-option '+(layoutMode===mode?'selected':'')+'" data-layout-choice="'+mode+'" aria-pressed="'+(layoutMode===mode)+'">'+localizedText(label,currentLanguage,'fr')+'</button>').join('')+'</div>'),
        appearance:()=>showNested(localizedText('Apparence',currentLanguage,'fr'),'<p class="sheet-copy">'+localizedText('Choisissez le thème de YZ.',currentLanguage,'fr')+'</p><div class="lang-options theme-options" role="group" aria-label="'+localizedText('Apparence',currentLanguage,'fr')+'">'+themeOptions()+'</div>'),
        bluetooth:()=>show('Bluetooth','<p class="sheet-copy">Raccourci vers les réglages Bluetooth du téléphone.</p><div class="device-list"><button class="device-card" data-choice="scan">'+svg('bluetooth')+'<div><strong>Ouvrir Bluetooth</strong><small>Choisir un casque ou un autoradio</small></div>'+svg('chevron')+'</button><div class="device-card">'+svg('sound')+'<div><strong>Appareils enregistrés</strong><small>Aucun appareil connecté dans cette maquette</small></div></div></div>'),
        'android-settings':()=>show('Paramètres Android','<p class="sheet-copy">Accès aux réglages système autorisés sur cet appareil dédié.</p>'+row('phone','Ouvrir les paramètres','Système','system')+row('bluetooth','Bluetooth','Connexions','scan')+row('sound','Son et volume','Audio','volume')),
        zemer:()=>show('Zemer','<p class="sheet-copy">Lecteur Zemer installé séparément. Le launcher ne remplace pas l’application ni son catalogue.</p><div class="track-row"><span class="cover">'+svg('music')+'</span><span class="track-label"><span class="track-title">Zemer</span><span class="track-artist">Application de musique</span></span><span class="playing">PRÊT À OUVRIR</span></div><div class="sheet-copy" style="margin:13px 0 0">Le raccourci ouvrira l’application Zemer sur le téléphone.</div>'),
        pulsar:()=>show('Pulsar · musique locale','<p class="sheet-copy">Pour écouter les fichiers musicaux copiés depuis un ordinateur.</p><div class="track-row"><span class="cover" style="background:linear-gradient(145deg,#55456f,#292536)">'+svg('disk')+'</span><span class="track-label"><span class="track-title">Pulsar Music Player</span><span class="track-artist">Bibliothèque locale · lecture hors ligne</span></span></div><div class="sheet-copy" style="margin:13px 0 0">Pulsar sera une application distincte, installée à côté du launcher.</div>'),
        waze:()=>show('Mode voiture','<p class="sheet-copy">Un accès rapide à la navigation, sans intégrer Waze dans le launcher.</p><div class="track-row"><span class="cover" style="background:linear-gradient(145deg,#365047,#242a29)">'+svg('map')+'</span><span class="track-label"><span class="track-title">Waze</span><span class="track-artist">Application facultative</span></span><span class="playing">OPTIONNEL</span></div><div class="sheet-copy" style="margin:13px 0 0">Le raccourci apparaîtra si l’option Waze est choisie à l’installation.</div>')
      };
      document.addEventListener('click',e=>{
        const layoutChoice=e.target.closest('[data-layout-choice]');if(layoutChoice){e.preventDefault();applyLayout(layoutChoice.dataset.layoutChoice,true);updateOrientationMode();sheetStack.length=0;pages.launcher();pages.layout();return}
        const layoutLink=e.target.closest('[data-choice="layout"]');if(layoutLink){e.preventDefault();pages.layout();return}
        const mediaCommand=e.target.closest('[data-media-command]');if(mediaCommand){e.preventDefault();if(window.YZMDM&&typeof YZMDM.sendMediaButton==='function')YZMDM.sendMediaButton(mediaCommand.dataset.mediaCommand);else toast('Les commandes audio sont disponibles dans YZ sur Android.');return}
        const backButton=e.target.closest('[data-back]');if(backButton){e.preventDefault();const previous=sheetStack.pop();if(previous!==undefined){panel.innerHTML=previous;sheet.hidden=false;applyLanguage(currentLanguage,panel,'fr',false);panel.querySelector('[data-close]')?.focus()}return}const themeButton=e.target.closest('[data-theme-choice]');if(themeButton){e.preventDefault();applyAppearance(themeButton.dataset.themeChoice,true);sheetStack.length=0;pages.launcher();pages.appearance();return}
        const languageButton=e.target.closest('[data-language]');if(languageButton){e.preventDefault();applyLanguage(languageButton.dataset.language,document.body,currentLanguage,true);if(languageButton.closest('#sheet')&&sheetStack.length){sheetStack.length=0;pages.launcher();pages.language()}return}
        if(e.target.closest('[data-close]')||e.target===sheet){sheetStack.length=0;sheet.hidden=true;return}
        const toggle=e.target.closest('[data-toggle]');if(toggle){const enabled=!toggle.classList.contains('on');toggle.classList.toggle('on',enabled);toggle.setAttribute('aria-checked',String(enabled));applyToggleSetting(toggle,enabled);return}
        const open=e.target.closest('[data-open]');if(open){const fn=pages[open.dataset.open];if(fn)fn();return}
        const choice=e.target.closest('[data-choice]');if(choice){
        if(choice.dataset.choice==='appearance'){e.preventDefault();e.stopImmediatePropagation();pages.appearance();return}
        if(choice.dataset.choice==='language'){e.preventDefault();e.stopImmediatePropagation();pages.language();return}
        if(choice.dataset.choice==='update'&&window.YZMDM&&typeof YZMDM.checkForUpdates==='function'){e.preventDefault();e.stopImmediatePropagation();sheet.hidden=true;YZMDM.checkForUpdates();return}
        if(choice.dataset.choice==='release-owner'&&window.YZMDM&&typeof YZMDM.requestOwnerExitCode==='function'){e.preventDefault();e.stopImmediatePropagation();sheet.hidden=true;YZMDM.requestOwnerExitCode();return}
        const messages={update:'Aucune mise à jour disponible dans cette maquette.',system:'Les paramètres Android s’ouvriront sur l’appareil.',scan:'Les réglages Bluetooth du téléphone s’ouvriront.',volume:'Les réglages audio du téléphone s’ouvriront.'};toast(messages[choice.dataset.choice]||'Aperçu interactif');return}
      });
      document.addEventListener('keydown',e=>{if(e.key==='Escape')sheet.hidden=true});
      function toast(message){message=localizedText(message,currentLanguage,'fr');document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=message;document.querySelector('.device').append(t);clearTimeout(timer);timer=setTimeout(()=>t.remove(),2200)}
      window.setLocalPlayerState=function(state){const labels={fr:{'Lecteur audio':'Lecteur audio','Musique locale':'Musique locale','Choisir des fichiers audio':'Choisir des fichiers audio'},en:{'Lecteur audio':'Audio player','Musique locale':'Local music','Choisir des fichiers audio':'Choose audio files'},he:{'Lecteur audio':'נגן מוזיקה','Musique locale':'מוזיקה מקומית','Choisir des fichiers audio':'בחירת קובצי מוזיקה'},yi:{'Lecteur audio':'מוזיק־שפּילער','Musique locale':'לאָקאַלע מוזיק','Choisir des fichiers audio':'אויסקלײַבן מוזיק־טעקעס'}}[currentLanguage]||{};const title=document.querySelector('.media-dock-title'),subtitle=document.querySelector('.media-dock-sub'),play=document.querySelector('[data-media-command="play"]'),pause=document.querySelector('[data-media-command="pause"]');if(title){const value=state.title||'Lecteur audio';title.textContent=labels[value]||value}if(subtitle){const value=state.subtitle||'Musique locale';subtitle.textContent=labels[value]||value}if(play)play.hidden=!!state.playing;if(pause)pause.hidden=!state.playing;const hasTrack=!!state.hasTrack,choose=document.querySelector('[data-media-command="choose"]'),previous=document.querySelector('[data-media-command="previous"]'),next=document.querySelector('[data-media-command="next"]'),progress=document.querySelector('#media-progress-fill');if(choose)choose.hidden=hasTrack;if(previous)previous.hidden=!hasTrack;if(next)next.hidden=!hasTrack;if(progress)progress.style.transform='scaleX('+Math.max(0,Math.min(1,Number(state.progress)||0))+')'};
      function refreshDeviceStatus(){const level=document.querySelector('#battery-level');if(!window.YZMDM||typeof YZMDM.getDeviceStatus!=='function'){if(level)level.textContent='--%';return}try{const s=JSON.parse(YZMDM.getDeviceStatus());const wifi=document.querySelector('#wifi-status'),mobile=document.querySelector('#mobile-status'),offline=document.querySelector('#offline-status'),charge=document.querySelector('#battery-charge');const hasNetwork=!!(s.wifi||s.mobile||s.connected);if(wifi)wifi.hidden=!s.wifi;if(mobile)mobile.hidden=!s.mobile;if(offline)offline.hidden=hasNetwork;const batteryPercent=Number(s.batteryPercent);if(level)level.textContent=Number.isFinite(batteryPercent)&&batteryPercent>=0?Math.max(0,Math.min(100,batteryPercent))+'%':'--%';if(charge)charge.hidden=!s.charging}catch(_){if(level)level.textContent='--%'}}
      function tick(){const d=new Date,locale={en:'en-GB',fr:'fr-FR',he:'he-IL',yi:'yi'}[currentLanguage]||'fr-FR';const formattedTime=d.toLocaleTimeString(locale,{hour:'2-digit',minute:'2-digit'});const visibleTime=formattedTime.replace(':',' : ');const clockElement=document.querySelector('#clock'),homeClock=document.querySelector('#home-clock');if(clockElement)clockElement.textContent=visibleTime;if(homeClock)homeClock.textContent=formattedTime;const dateLine=document.querySelector('#date-line');if(dateLine){const day=new Intl.DateTimeFormat(locale,{weekday:'long',day:'numeric',month:'long'}).format(d);let hebrew='';try{hebrew=new Intl.DateTimeFormat(locale+'-u-ca-hebrew',{day:'numeric',month:'long',year:'numeric'}).format(d)}catch(_){}dateLine.textContent=hebrew?day+' · '+hebrew:day;const homeDate=document.querySelector('#home-date');if(homeDate)homeDate.textContent=dateLine.textContent}refreshDeviceStatus()}tick();setInterval(tick,15000);
      if(window.YZMDM){
        document.body.classList.add('android-app');
        updateOrientationMode();
        document.addEventListener('click',e=>{
          const admin=e.target.closest('.home-datetime');
          if(admin){YZMDM.adminTap();return}
          const open=e.target.closest('[data-open]');
          if(open){const app=open.dataset.open;if(app==='launcher')return;e.preventDefault();e.stopImmediatePropagation();sheet.hidden=true;({zemer:()=>YZMDM.openZemer(),pulsar:()=>typeof YZMDM.openPulsar==='function'?YZMDM.openPulsar():toast('Pulsar sera disponible après son installation et son autorisation.'),waze:()=>YZMDM.openWaze(),bluetooth:()=>YZMDM.openBluetoothSettings(),'android-settings':()=>YZMDM.openSettings()})[app]?.();return}
          const toggle=e.target.closest('[data-toggle]');
          if(toggle){const enabled=toggle.getAttribute('aria-checked')!=='true';if(toggle.dataset.toggle==='map'&&typeof YZMDM.setWazeVisible==='function')YZMDM.setWazeVisible(enabled);else if(toggle.dataset.toggle==='lock'){e.preventDefault();e.stopImmediatePropagation();toast(typeof YZMDM.isDeviceOwner==='function'&&YZMDM.isDeviceOwner()?'La sortie du mode dédié se trouve dans l’accès administrateur.':'Active le mode dédié pendant la configuration ADB.')}}
          const choice=e.target.closest('[data-choice]');
          if(choice){if(choice.dataset.choice==='home-role'){e.preventDefault();e.stopImmediatePropagation();sheet.hidden=true;YZMDM.openHomeRoleSettings()}else if(choice.dataset.choice==='notifications'){e.preventDefault();e.stopImmediatePropagation();sheet.hidden=true;YZMDM.openNotificationSettings()}else if(choice.dataset.choice==='system'){e.preventDefault();e.stopImmediatePropagation();sheet.hidden=true;YZMDM.openSettings()}else if(choice.dataset.choice==='scan'){e.preventDefault();e.stopImmediatePropagation();sheet.hidden=true;YZMDM.openBluetoothSettings()}else if(choice.dataset.choice==='volume'){e.preventDefault();e.stopImmediatePropagation();sheet.hidden=true;YZMDM.openSoundSettings()}}
        },true);
      }
    })();
  </script>
</body>
</html>
