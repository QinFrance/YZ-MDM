<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>YiDream — launcher musical</title>
  <style>
    :root{color-scheme:dark;--bg:#111217;--surface:#191a20;--surface-2:#202127;--line:#303139;--text:#f3f1f6;--muted:#aaa9b4;--blue:#a9c8db;--lilac:#c4b3e4;--green:#b9d9c8}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 30%,#24242d 0,#101115 58%);font:15px/1.45 Roboto,"Noto Sans",Arial,sans-serif;color:var(--text);display:grid;place-items:center;padding:24px}
    body.android-app{display:block;min-height:100dvh;padding:0;overflow:hidden;background:var(--bg)}body.android-app .status{display:none}body.android-app .top{padding-top:env(safe-area-inset-top)}body.android-app .device{width:100vw;height:100dvh;max-height:none;min-height:0;border:0;border-radius:0;box-shadow:none}
    button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
    .device{position:relative;width:min(100%,410px);height:min(850px,calc(100svh - 48px));min-height:700px;overflow:hidden;border:1px solid #3a3b44;border-radius:32px;background:var(--bg);box-shadow:0 28px 85px #0009;display:flex;flex-direction:column}
    .status{height:35px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px;color:#d3d1d9;font-size:12px;letter-spacing:.2px}.status-icons{display:flex;gap:8px;align-items:center}.status-icons svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
    .top{height:70px;flex:none;display:flex;align-items:center;padding:0 20px;gap:13px}.brand-mark{width:48px;height:48px;flex:none;border-radius:15px;background:#fff;box-shadow:0 2px 10px #0003;overflow:hidden;display:grid;place-items:center}.brand-mark img{display:block;width:100%;height:100%;object-fit:cover}.brand-mark svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.brand-copy{min-width:0;flex:1}.brand-name{font-size:18px;font-weight:650;letter-spacing:.1px}.brand-caption{font-size:11px;color:var(--muted);margin-top:1px}.top-button{width:42px;height:42px;border:1px solid var(--line);border-radius:15px;background:var(--surface);display:grid;place-items:center;color:#d0ced8}.top-button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .scroll{overflow:auto;overscroll-behavior:contain;scrollbar-width:none;padding:6px 18px 20px;flex:1}.scroll::-webkit-scrollbar{display:none}.greeting{padding:10px 2px 19px}.greeting .eyebrow{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);font-weight:650}.greeting h1{font-size:25px;line-height:1.2;letter-spacing:-.55px;margin:5px 0 5px;font-weight:620}.greeting p{font-size:12px;margin:0;color:var(--muted)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tile{position:relative;min-height:145px;text-align:left;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#202127,#18191e 76%);padding:15px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;overflow:hidden;transition:transform .14s,border-color .14s,background .14s}.tile:active{transform:scale(.98)}.tile:hover{border-color:#58535f}.tile-wide{grid-column:1/-1;min-height:153px}.tile-main{background:linear-gradient(125deg,#283746,#20232b 56%,#282432);border-color:#44515b}.tile-local{background:linear-gradient(145deg,#29243a,#201e28 70%);border-color:#453c53}.tile-map{min-height:116px;background:linear-gradient(110deg,#242e2d,#1d2122 60%,#29252a)}.tile-utilities{min-height:107px}
    .tile-ornament{position:absolute;right:-14px;top:-22px;width:132px;height:132px;border-radius:50%;opacity:.25;background:radial-gradient(circle at 35% 38%,#96bbd1 0,transparent 64%);pointer-events:none}.tile-local .tile-ornament{background:radial-gradient(circle at 35% 38%,#b69cde 0,transparent 64%)}.tile-map .tile-ornament{background:radial-gradient(circle at 35% 38%,#91c1a7 0,transparent 64%)}
    .tile-top{position:relative;z-index:1;display:flex;width:100%;align-items:flex-start;justify-content:space-between}.tile-icon{width:39px;height:39px;border:1px solid #ffffff17;border-radius:14px;background:#ffffff0b;display:grid;place-items:center;color:var(--blue)}.tile-local .tile-icon{color:var(--lilac)}.tile-map .tile-icon{color:var(--green)}.tile-icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.status-pill{font-size:9px;color:#c8d7df;background:#2f414a;border:1px solid #50606a;border-radius:99px;padding:4px 8px;line-height:1.2}.tile-bottom{position:relative;z-index:1}.tile-title{font-size:17px;font-weight:650;letter-spacing:-.2px}.tile-sub{font-size:11px;color:#b6b5bf;margin-top:2px}.tile-arrow{position:absolute;right:14px;bottom:15px;width:30px;height:30px;border:1px solid #ffffff16;border-radius:50%;display:grid;place-items:center;color:#d4d2dd;background:#ffffff08}.tile-arrow svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}.section-head h2{margin:0;font-size:14px;font-weight:600;color:#d9d6e0}.section-head span{font-size:10px;color:var(--muted)}.utility-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.utility{height:74px;border:1px solid var(--line);border-radius:16px;background:var(--surface);display:flex;align-items:center;gap:11px;padding:11px;text-align:left}.utility .tile-icon{width:37px;height:37px;flex:none;border-radius:13px;color:#cbbce5}.utility-title{font-size:12px;font-weight:600}.utility-sub{font-size:10px;color:var(--muted);margin-top:1px}.bottom-note{display:flex;align-items:center;justify-content:center;gap:6px;color:#8e8e99;font-size:9px;padding:17px 0 4px}.bottom-note svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}
    .scrim{position:absolute;inset:35px 0 0;z-index:4;background:#0009;display:flex;align-items:flex-end}.scrim[hidden]{display:none}.sheet{width:100%;max-height:88%;overflow:auto;padding:20px 19px max(22px,env(safe-area-inset-bottom));border-top:1px solid #45434d;border-radius:24px 24px 0 0;background:#202127;box-shadow:0 -18px 55px #0008;animation:rise .18s ease-out}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.sheet h2{margin:0;font-size:18px;font-weight:620}.close{height:34px;width:34px;border:0;border-radius:12px;background:#32333b;display:grid;place-items:center;color:#e0dde7}.close svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}.sheet-copy{font-size:11px;color:var(--muted);margin:-7px 0 15px}.pref{min-height:60px;display:flex;align-items:center;gap:12px;border-top:1px solid #35363e}.pref-icon{width:34px;height:34px;border-radius:12px;background:#302e39;color:#cbbbe4;display:grid;place-items:center;flex:none}.pref-icon svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.pref-copy{flex:1}.pref-title{font-size:12px;font-weight:580}.pref-sub{font-size:10px;color:var(--muted);margin-top:2px}.toggle{width:37px;height:22px;flex:none;border:0;border-radius:99px;padding:3px;background:#494950}.toggle:after{content:"";display:block;width:16px;height:16px;border-radius:50%;background:#d7d5dc;transition:transform .16s}.toggle.on{background:#70658b}.toggle.on:after{transform:translateX(15px);background:#f0e9ff}.sheet-button{width:100%;height:44px;margin-top:10px;border:1px solid #47464f;border-radius:13px;background:#2b2c33;text-align:left;padding:0 13px;display:flex;align-items:center;gap:10px;font-size:11px}.sheet-button svg{width:17px;height:17px;stroke:#cbbbe4;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.sheet-button span{flex:1}.sheet-button em{font-style:normal;color:var(--muted);font-size:10px}.track-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid #35363e}.cover{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#3a5265,#736c83);color:#edf2f6}.cover svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7}.track-label{flex:1}.track-title{font-size:12px;font-weight:600}.track-artist{font-size:10px;color:var(--muted);margin-top:2px}.playing{font-size:9px;color:#c1d8e6}.device-list{display:grid;gap:8px}.device-card{display:flex;align-items:center;gap:11px;border:1px solid #3a3a42;border-radius:14px;background:#27282f;padding:12px;text-align:left}.device-card svg{width:19px;height:19px;color:#cbbbe4;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.device-card div{flex:1}.device-card strong{font-size:11px}.device-card small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.device-card .arrow{flex:none;color:#9d9ba5}.toast{position:absolute;z-index:8;bottom:22px;left:50%;transform:translate(-50%,0);border:1px solid #4c4b54;border-radius:99px;padding:9px 13px;background:#303139;color:#f3f1f6;font-size:10px;white-space:nowrap;box-shadow:0 8px 20px #0008}
    @keyframes rise{from{transform:translateY(20px);opacity:.4}to{transform:translateY(0);opacity:1}}
    @media(max-width:480px){body{padding:0;background:var(--bg)}.device{width:100%;height:100svh;min-height:620px;border:0;border-radius:0;box-shadow:none}.status{padding-top:env(safe-area-inset-top);height:calc(36px + env(safe-area-inset-top))}.scrim{inset:calc(36px + env(safe-area-inset-top)) 0 0}}
    @media(orientation:landscape) and (max-height:580px){body{padding:10px}.device{width:min(100%,920px);height:calc(100svh - 20px);min-height:0;border-radius:24px}.scroll{padding:0 20px 14px}.greeting{padding:3px 2px 12px}.greeting h1{font-size:21px}.grid{grid-template-columns:repeat(3,1fr)}.tile-wide{grid-column:auto;min-height:125px}.tile{min-height:125px}.tile-map{min-height:125px}.section-head{margin-top:15px}.utility-grid{grid-template-columns:repeat(2,1fr)}.bottom-note{padding-top:9px}}
    .lang-block{border-top:1px solid #35363e;padding:13px 0 4px}.lang-heading{font-size:12px;font-weight:600}.lang-caption{font-size:10px;color:var(--muted);margin-top:2px}.lang-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.lang-option{height:37px;border:1px solid #44434c;border-radius:12px;background:#292a31;color:#d9d7e0;font-size:11px}.lang-option.selected{background:#373342;border-color:#81739a;color:#f2eaff}
    html[dir=rtl] .top,html[dir=rtl] .greeting,html[dir=rtl] .section-head,html[dir=rtl] .utility,html[dir=rtl] .tile{text-align:right}html[dir=rtl] .tile-arrow{right:auto;left:14px}html[dir=rtl] .tile-ornament{right:auto;left:-14px}html[dir=rtl] .status,html[dir=rtl] .status-icons,html[dir=rtl] .lang-options{direction:ltr}html[dir=rtl] .top-button{margin-right:auto;margin-left:0}
    .car-eyebrow,.car-title{display:none}
    [hidden]{display:none!important}
    .tile-map .tile-icon{background:#18364a;color:#63c9f0}.tile-map .tile-icon svg{fill:currentColor;stroke:none}
    body.car-mode{padding:0!important;place-items:stretch}
    body.car-mode .device{width:100vw;height:100dvh;max-height:none;min-height:0;border:0;border-radius:0;box-shadow:none}
    body.car-mode .status{display:none}
    body.car-mode .top{height:62px;min-height:62px;justify-content:space-between;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
    body.car-mode .brand-mark{width:48px;height:48px}
    body.car-mode .brand-copy{display:none}
    body.car-mode .top-button{width:52px;height:52px;border-radius:18px}
    body.car-mode .scroll{display:flex;flex-direction:column;gap:0;min-height:0;padding:8px max(16px,env(safe-area-inset-left)) max(14px,env(safe-area-inset-bottom));overflow:hidden}
    body.car-mode .greeting,body.car-mode .section-head,body.car-mode .bottom-note{display:none}
    body.car-mode .grid{display:grid;flex:1;min-height:0;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(0,1fr);gap:clamp(10px,1.8vw,20px)}
    body.car-mode .tile{min-width:0;min-height:0;padding:clamp(14px,2vw,28px);border-radius:24px;justify-content:space-between}
    body.car-mode .tile-wide{grid-column:auto}
    body.car-mode .tile-sub,body.car-mode .tile-arrow,body.car-mode .tile-ornament,body.car-mode .status-pill,body.car-mode [data-open="pulsar"],body.car-mode [data-open="bluetooth"],body.car-mode [data-open="android-settings"]{display:none}
    body.car-mode .tile-icon{width:clamp(46px,7vh,66px);height:clamp(46px,7vh,66px);border-radius:19px}
    body.car-mode .tile-icon svg{width:clamp(25px,3.4vh,34px);height:clamp(25px,3.4vh,34px)}
    body.car-mode .tile-title{font-size:clamp(19px,2.5vw,30px);line-height:1.15;overflow-wrap:anywhere}
    body.car-mode.single-car-app .tile-main{grid-column:1/-1}
    body.car-mode .tile:active{transform:scale(.985)}
    @media(max-height:340px){body.car-mode .top{height:48px;min-height:48px}body.car-mode .brand-mark{width:40px;height:40px}body.car-mode .top-button{width:44px;height:44px}body.car-mode .scroll{padding-top:4px;padding-bottom:8px}body.car-mode .grid{gap:8px}body.car-mode .tile{padding:10px;border-radius:18px}body.car-mode .tile-icon{width:40px;height:40px;border-radius:14px}body.car-mode .tile-icon svg{width:24px;height:24px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>

  <script>

      function applyToggleSetting(toggle,enabled){
        if(toggle.dataset.toggle==='rotate'){carModeAutomatic=enabled;savePreference('yidream-car-mode-auto',enabled)}
        if(toggle.dataset.toggle==='map'){wazeEnabled=enabled;savePreference('yidream-show-waze',enabled)}
        updateOrientationMode();
      }
      updateOrientationMode();
      if(orientationQuery.addEventListener)orientationQuery.addEventListener('change',updateOrientationMode);
      else orientationQuery.addListener(updateOrientationMode);
      window.addEventListener('orientationchange',updateOrientationMode);
      window.addEventListener('resize',updateOrientationMode);
      function show(title,body){panel.innerHTML=`<div class="sheet-head"><h2 id="sheet-title">${title}</h2><button class="close" data-close aria-label="Fermer">${svg('x')}</button></div>${body}`;sheet.hidden=false;applyLanguage(currentLanguage,panel,'fr',false);panel.querySelector('[data-close]').focus()}
      function pref(icon,title,sub,toggle=false,on=false){return `<div class="pref"><span class="pref-icon">${svg(icon)}</span><span class="pref-copy"><span class="pref-title">${title}</span><span class="pref-sub">${sub}</span></span>${toggle?`<button class="toggle ${on?'on':''}" role="switch" aria-checked="${on}" aria-label="${title}" data-toggle="${icon}"></button>`:''}</div>`}
      const row=(icon,title,sub,id)=>`<button class="sheet-button" data-choice="${id}">${svg(icon)}<span>${title}</span><em>${sub}</em>${svg('chevron')}</button>`;
      const pages={
        launcher:()=>{const native=typeof YZMDM!=='undefined',owner=native&&typeof YZMDM.isDeviceOwner==='function'&&YZMDM.isDeviceOwner(),waze=wazeEnabled;const languageOptions=[['en','English'],['fr','Français'],['he','עברית'],['yi','ייִדיש']].map(([code,label])=>'<button class="lang-option" data-language="'+code+'" aria-pressed="'+(currentLanguage===code)+'">'+label+'</button>').join('');return show('Réglages du launcher','<p class="sheet-copy">Personnalisez l’écran d’accueil YiDream.</p>'+pref('rotate','Mode voiture automatique','S’active quand l’écran passe en paysage',true,carModeAutomatic)+pref('map','Afficher Waze','Ajouter le raccourci voiture à l’accueil',true,waze)+pref('lock','Mode appareil dédié',owner?'Actif · accès administrateur pour modifier':'À configurer lors de l’installation',true,owner)+'<div class="lang-block"><div class="lang-heading">Langue de l’application</div><div class="lang-caption">Choisissez la langue de YiDream</div><div class="lang-options" role="group" aria-label="Langue de l’application">'+languageOptions+'</div></div>'+'<div class="pref"><span class="pref-icon">'+svg('refresh')+'</span><span class="pref-copy"><span class="pref-title">Mise à jour YiDream</span><span class="pref-sub">Vérifie et installe la dernière version depuis YiDream</span></span></div>'+row('refresh','Installer la mise à jour','Vérifier maintenant','update')+row('phone','Choisir YiDream comme écran d’accueil','Demander à Android de définir YiDream','home-role'))},
        bluetooth:()=>show('Bluetooth','<p class="sheet-copy">Raccourci vers les réglages Bluetooth du téléphone.</p><div class="device-list"><button class="device-card" data-choice="scan">'+svg('bluetooth')+'<div><strong>Ouvrir Bluetooth</strong><small>Choisir un casque ou un autoradio</small></div>'+svg('chevron')+'</button><div class="device-card">'+svg('sound')+'<div><strong>Appareils enregistrés</strong><small>Aucun appareil connecté dans cette maquette</small></div></div></div>'),
        'android-settings':()=>show('Paramètres Android','<p class="sheet-copy">Accès aux réglages système autorisés sur cet appareil dédié.</p>'+row('phone','Ouvrir les paramètres','Système','system')+row('bluetooth','Bluetooth','Connexions','scan')+row('sound','Son et volume','Audio','volume')),
        zemer:()=>show('Zemer','<p class="sheet-copy">Lecteur Zemer installé séparément. Le launcher ne remplace pas l’application ni son catalogue.</p><div class="track-row"><span class="cover">'+svg('music')+'</span><span class="track-label"><span class="track-title">Zemer</span><span class="track-artist">Application de musique</span></span><span class="playing">PRÊT À OUVRIR</span></div><div class="sheet-copy" style="margin:13px 0 0">Le raccourci ouvrira l’application Zemer sur le téléphone.</div>'),
        pulsar:()=>show('Pulsar · musique locale','<p class="sheet-copy">Pour écouter les fichiers musicaux copiés depuis un ordinateur.</p><div class="track-row"><span class="cover" style="background:linear-gradient(145deg,#55456f,#292536)">'+svg('disk')+'</span><span class="track-label"><span class="track-title">Pulsar Music Player</span><span class="track-artist">Bibliothèque locale · lecture hors ligne</span></span></div><div class="sheet-copy" style="margin:13px 0 0">Pulsar sera une application distincte, installée à côté du launcher.</div>'),
        waze:()=>show('Mode voiture','<p class="sheet-copy">Un accès rapide à la navigation, sans intégrer Waze dans le launcher.</p><div class="track-row"><span class="cover" style="background:linear-gradient(145deg,#365047,#242a29)">'+svg('map')+'</span><span class="track-label"><span class="track-title">Waze</span><span class="track-artist">Application facultative</span></span><span class="playing">OPTIONNEL</span></div><div class="sheet-copy" style="margin:13px 0 0">Le raccourci apparaîtra si l’option Waze est choisie à l’installation.</div>')
      };
      document.addEventListener('click',e=>{
        const languageButton=e.target.closest('[data-language]');if(languageButton){e.preventDefault();applyLanguage(languageButton.dataset.language,document.body,currentLanguage,true);return}
        if(e.target.closest('[data-close]')||e.target===sheet){sheet.hidden=true;return}
        const toggle=e.target.closest('[data-toggle]');if(toggle){const enabled=!toggle.classList.contains('on');toggle.classList.toggle('on',enabled);toggle.setAttribute('aria-checked',String(enabled));applyToggleSetting(toggle,enabled);return}
        const open=e.target.closest('[data-open]');if(open){const fn=pages[open.dataset.open];if(fn)fn();return}
        const choice=e.target.closest('[data-choice]');if(choice){
        if(choice.dataset.choice==='update'&&window.YZMDM&&typeof YZMDM.checkForUpdates==='function'){e.preventDefault();e.stopImmediatePropagation();sheet.hidden=true;YZMDM.checkForUpdates();return}
        const messages={update:'Aucune mise à jour disponible dans cette maquette.',system:'Les paramètres Android s’ouvriront sur l’appareil.',scan:'Les réglages Bluetooth du téléphone s’ouvriront.',volume:'Les réglages audio du téléphone s’ouvriront.'};toast(messages[choice.dataset.choice]||'Aperçu interactif');return}
      });
      document.addEventListener('keydown',e=>{if(e.key==='Escape')sheet.hidden=true});
      function toast(message){message=localizedText(message,currentLanguage,'fr');document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=message;document.querySelector('.device').append(t);clearTimeout(timer);timer=setTimeout(()=>t.remove(),2200)}
      function tick(){const d=new Date,locale={en:'en-GB',fr:'fr-FR',he:'he-IL',yi:'yi'}[currentLanguage]||'fr-FR';clock.textContent=d.toLocaleTimeString(locale,{hour:'2-digit',minute:'2-digit'}).replace(':',' : ')}tick();setInterval(tick,30000);
      if(window.YZMDM){
        document.body.classList.add('android-app');
        updateOrientationMode();
        document.addEventListener('click',e=>{
          const admin=e.target.closest('.brand-name');
          if(admin){YZMDM.adminTap();return}
          const open=e.target.closest('[data-open]');
          if(open){const app=open.dataset.open;if(app==='launcher')return;e.preventDefault();e.stopImmediatePropagation();sheet.hidden=true;({zemer:()=>YZMDM.openZemer(),pulsar:()=>typeof YZMDM.openPulsar==='function'?YZMDM.openPulsar():toast('Pulsar sera disponible après son installation et son autorisation.'),waze:()=>YZMDM.openWaze(),bluetooth:()=>YZMDM.openBluetoothSettings(),'android-settings':()=>YZMDM.openSettings()})[app]?.();return}
          const toggle=e.target.closest('[data-toggle]');
          if(toggle){const enabled=toggle.getAttribute('aria-checked')!=='true';if(toggle.dataset.toggle==='map'&&typeof YZMDM.setWazeVisible==='function')YZMDM.setWazeVisible(enabled);else if(toggle.dataset.toggle==='lock'){e.preventDefault();e.stopImmediatePropagation();toast(typeof YZMDM.isDeviceOwner==='function'&&YZMDM.isDeviceOwner()?'La sortie du mode dédié se trouve dans l’accès administrateur.':'Active le mode dédié pendant la configuration ADB.')}}
          const choice=e.target.closest('[data-choice]');
          if(choice){if(choice.dataset.choice==='home-role'){e.preventDefault();e.stopImmediatePropagation();sheet.hidden=true;YZMDM.openHomeRoleSettings()}else if(choice.dataset.choice==='system'){e.preventDefault();e.stopImmediatePropagation();sheet.hidden=true;YZMDM.openSettings()}else if(choice.dataset.choice==='scan'){e.preventDefault();e.stopImmediatePropagation();sheet.hidden=true;YZMDM.openBluetoothSettings()}else if(choice.dataset.choice==='volume'){e.preventDefault();e.stopImmediatePropagation();sheet.hidden=true;YZMDM.openSoundSettings()}}
        },true);
      }
    })();
  </script>
</body>
</html>
